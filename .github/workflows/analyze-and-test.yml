name: Analyze and Test Code

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# A new push supersedes the previous run — don't burn minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Static Analysis & Tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create dummy env file
        run: |
          echo "VITE_SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=placeholder" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # 1. Lint (ESLint with @antfu/eslint-config — also enforces formatting)
      - name: Lint
        run: npm run lint

      # 1b. Locale parity check
      - name: Check Locale Parity
        run: npm run check:locales

      # 2. Type check (src + vite.config via project references — `-b` is required,
      #    the root tsconfig is solution-style and checks zero files without it)
      - name: Type Check
        run: npm run type-check

      # 2b. Type check test/ + scripts/. Non-blocking while the existing ~170 errors
      #     are burned down; flip `continue-on-error` off once it reaches zero.
      - name: Type Check Tests (non-blocking)
        run: npm run type-check:test
        continue-on-error: true

      # 3. Run unit/component tests
      - name: Run Tests
        run: npm run test
