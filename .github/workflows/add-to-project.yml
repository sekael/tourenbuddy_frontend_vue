name: Add issues to TouringBuddy project

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/users/sekael/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: bug, user-feedback
          label-operator: OR
