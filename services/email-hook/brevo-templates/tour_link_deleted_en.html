<!-- Subject: Your tour link for {{ params.tourName }} was dissolved on TourenBuddy -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour link dissolved</title>
    <style>
      body {
        font-family:
          Inter,
          -apple-system,
          sans-serif;
        background: #f8f9fa;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 480px;
        margin: 40px auto;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .header {
        background: #e65100;
        padding: 24px 32px;
      }
      .header h1 {
        color: #fff;
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      .body {
        padding: 32px;
        color: #1a1a1a;
      }
      .body p {
        margin: 0 0 16px;
        line-height: 1.6;
      }
      .cta {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 24px;
        background: #e65100;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .footer {
        padding: 20px 32px;
        font-size: 12px;
        color: #888;
        border-top: 1px solid #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>TourenBuddy</h1>
      </div>
      <div class="body">
        <p>Hi there,</p>

        <p>The link for <strong>{{ params.tourName }}</strong> was dissolved.</p>
        <p>Your tour is no longer linked with any other.</p>

        <a href="{{ params.appUrl }}/?tours=1" class="cta">View tour</a>
      </div>
      <div class="footer">
        You received this email because notifications are enabled for your TourenBuddy account. You can manage them in
        your profile settings.
      </div>
    </div>
  </body>
</html>
